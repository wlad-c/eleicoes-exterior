name: Sync TSE ZZ tallies

# Backup persistence for cold loads / SEO. The live page also pulls TSE
# directly in the browser and does not depend on this job.
# Press BU tallies are applied into results-runoff.json until TSE lands;
# open tabs re-read the deployed seed every ~2 minutes on runoff night.
on:
  schedule:
    # Quiet baseline: every 48h.
    - cron: '0 0 */2 * *'
    # Runoff window (UTC): every 15 min on 25–26 Oct.
    # GitHub cron is often delayed; denser schedule improves pickup.
    - cron: '*/15 * 25 10 *'
    - cron: '*/15 0-16 26 10 *'
  workflow_dispatch:
  # Re-run when the scraper or source list changes (does not replace schedule).
  push:
    branches: [main]
    paths:
      - 'scripts/scrape-press-runoff.mjs'
      - 'scripts/data/press-runoff-sources.json'
      - '.github/workflows/sync-tse.yml'

permissions:
  contents: write

concurrency:
  group: sync-tse-zz
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Decide sync mode
        id: mode
        run: |
          NOW=$(date -u +%s)
          # Press+TSE runoff window: NZ close → Monday afternoon UTC
          START=$(date -u -d '2026-10-25 04:00:00' +%s 2>/dev/null || date -u -j -f '%Y-%m-%d %H:%M:%S' '2026-10-25 04:00:00' +%s)
          END=$(date -u -d '2026-10-26 16:00:00' +%s 2>/dev/null || date -u -j -f '%Y-%m-%d %H:%M:%S' '2026-10-26 16:00:00' +%s)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "push" ] || { [ "$NOW" -ge "$START" ] && [ "$NOW" -lt "$END" ]; }; then
            echo "mode=runoff" >> "$GITHUB_OUTPUT"
          else
            echo "mode=round1" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync 1º turno seed
        if: steps.mode.outputs.mode == 'round1'
        run: npm run sync:tse

      - name: Sync runoff (TSE 6258 + press BUs apply)
        if: steps.mode.outputs.mode == 'runoff'
        run: |
          npm run sync:tse:runoff || true
          # Apply absolute press tallies into pending/press rows only.
          # Guards in the scraper: never overwrite source=tse; skip %-only
          # when absolute exists; primary outlets may revise downward.
          npm run scrape:press:runoff -- --apply || true

      - name: Build Pages
        run: npm run build:pages

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/results.json src/data/results-runoff.json docs/; then
            echo "No meaningful file changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/results.json src/data/results-runoff.json docs/ || true
          git commit -m "chore: sync TSE / press runoff tallies" || exit 0
          git push origin HEAD:main
