name: Sync TSE ZZ tallies

# Manual-only. Scheduled / push-triggered syncs were disabled after TSE
# runoff totalization reached 100% (ZZ + domestic Brazil).
# The live page can still pull TSE directly in the browser on demand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tse-zz
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Decide sync mode
        id: mode
        run: |
          # Default to runoff after election day; override via workflow input later if needed.
          echo "mode=runoff" >> "$GITHUB_OUTPUT"

      - name: Sync 1º turno seed
        if: steps.mode.outputs.mode == 'round1'
        run: npm run sync:tse

      - name: Sync runoff (TSE 6258 + Brazil domestic UFs)
        if: steps.mode.outputs.mode == 'runoff'
        run: |
          npm run sync:tse:runoff
          npm run sync:brazil:runoff -- --uf-only

      - name: Build Pages
        run: npm run build:pages

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/results.json src/data/results-runoff.json docs/; then
            echo "No meaningful file changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/results.json src/data/results-runoff.json docs/ || true
          git commit -m "chore: sync TSE runoff tallies" || exit 0
          git push origin HEAD:main
